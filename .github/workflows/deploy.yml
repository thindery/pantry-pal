name: Deploy Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  HUSKY: '0'

jobs:
  # ============================================
  # Job 1: Test & Lint (repo root is the app)
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:run

      - name: Backend contract tests
        run: npm run test:backend

      - name: Build frontend
        run: npm run build:frontend

  # ============================================
  # Job 2: Database Migration Check
  # ============================================
  migration-check:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for migration files
        id: check-migrations
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "database/migrations/.*\.sql"; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "Database migrations detected"
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "No migrations detected"
          fi

      - name: Verify migrations are backwards-compatible
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: |
          echo "Migrations detected. Verify they follow backwards-compatible rules:"
          echo "   1. Only ADD columns/tables, never REMOVE/RENAME"
          echo "   2. New columns must have DEFAULT values"
          echo "   3. Deploy code BEFORE migration when removing"
          echo "Changed migration files:"
          git diff --name-only HEAD~1 HEAD | grep "database/migrations/.*\.sql" || true

  # Production ships via SSH/OVH (`./deploy/deploy-docker.sh`), not GitHub Actions.
  # Railway/Vercel jobs and pantry-pal.app / api.pantry-pal.com probes were removed:
  # those hosts are decommissioned (PP-035), and Cloudflare bot-fight challenges
  # GitHub-hosted runners (403) so a live www.mypantryhub.com curl would false-fail.

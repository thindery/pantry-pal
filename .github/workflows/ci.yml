name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: SQL safety guard
        run: npm run test:sql-safety

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:run

      - name: Backend contract tests
        run: npm run test:backend

      - name: Build frontend
        run: npm run build:frontend

  postgres-integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pantry_pal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d pantry_pal_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Postgres integration tests
        env:
          RUN_POSTGRES_TESTS: '1'
          DATABASE_URL: postgresql://test:test@localhost:5432/pantry_pal_test
          ALLOW_TEST_AUTH: '1'
        run: npm run test:postgres
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Garlic Butter Pasta</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Foodie Delights",
          "url": "https://example.com"
        },
        {
          "@type": "Recipe",
          "name": "Garlic Butter Pasta",
          "yield": "4 servings",
          "recipeIngredient": [
            "8 oz pasta",
            "4 cloves garlic, minced",
            "4 tbsp butter",
            "1/4 cup parmesan cheese",
            "salt and black pepper to taste"
          ],
          "recipeInstructions": [
            {
              "@type": "HowToStep",
              "text": "Boil pasta according to package directions in salted water."
            },
            {
              "@type": "HowToStep",
              "text": "Melt butter in a large skillet over medium heat and sauté minced garlic for 1 minute."
            },
            {
              "@type": "HowToStep",
              "text": "Toss drained pasta with garlic butter, parmesan, and season with salt and black pepper."
            }
          ]
        }
      ]
    }
    </script>
</head>
<body>
    <h1>Garlic Butter Pasta</h1>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tomato Basil Soup</title>
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Soup Masters"
      },
      {
        "@context": "https://schema.org",
        "@type": "http://schema.org/Recipe",
        "name": "Tomato Basil Soup",
        "recipeYield": "4",
        "recipeIngredient": [
          "2 cans whole peeled tomatoes",
          "1 cup vegetable broth",
          "1/2 cup heavy cream",
          "1/4 cup fresh basil leaves",
          "salt to taste"
        ],
        "recipeInstructions": [
          "Simmer tomatoes and vegetable broth in a pot for 15 minutes.",
          "Puree soup using an immersion blender until smooth.",
          "Stir in heavy cream and fresh basil leaves, then season with salt."
        ]
      }
    ]
    </script>
</head>
<body>
    <h1>Tomato Basil Soup</h1>
</body>
</html>

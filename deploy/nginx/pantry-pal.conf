# mypantryhub.com — Pantry Hub (public SaaS, Clerk auth in-app)
# Installed to /opt/nginx/conf.d/pantry-pal.conf (central Docker nginx on app-network)

# --- HTTP redirects ---
server {
    listen 80;
    server_name mypantryhub.com;
    return 301 https://www.mypantryhub.com$request_uri;
}

server {
    listen 80;
    server_name www.mypantryhub.com;
    return 301 https://www.mypantryhub.com$request_uri;
}

server {
    listen 80;
    server_name *.mypantryhub.com;
    return 301 https://www.mypantryhub.com$request_uri;
}

# --- HTTPS: apex → www ---
server {
    listen 443 ssl;
    http2 on;
    server_name mypantryhub.com;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://www.mypantryhub.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.mypantryhub.com;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream pantry-pal-backend:52841;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream pantry-pal-backend:52841;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream pantry-pal-frontend:38472;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name *.mypantryhub.com;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://www.mypantryhub.com$request_uri;
}
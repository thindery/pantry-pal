# PantryPal nginx vhost — placeholder domain until PP-033
# Replace pantry-pal.example with your production domain.

upstream pantry_pal_frontend {
    server 127.0.0.1:3000;
}

upstream pantry_pal_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name pantry-pal.example;

    # Redirect to HTTPS once TLS is configured (PP-033)
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://pantry_pal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://pantry_pal_backend;
    }

    location / {
        proxy_pass http://pantry_pal_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
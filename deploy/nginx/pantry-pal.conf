# mypantryhub.com — Pantry Hub (public SaaS, NextAuth in frontend)
# Installed to /opt/nginx/conf.d/pantry-pal.conf (central Docker nginx on app-network)
# Baseline: require-cloudflare on every server (ovh_security_baseline.md / PP-070)

# --- HTTP redirects ---
server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 80;
    server_name mypantryhub.com;
    return 301 https://www.mypantryhub.com$request_uri;
}

server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 80;
    server_name www.mypantryhub.com;
    return 301 https://www.mypantryhub.com$request_uri;
}

server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 80;
    server_name *.mypantryhub.com;
    return 301 https://www.mypantryhub.com$request_uri;
}

# --- HTTPS: apex → www ---
server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 443 ssl;
    http2 on;
    server_name mypantryhub.com;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://www.mypantryhub.com$request_uri;
}

server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 443 ssl;
    http2 on;
    server_name www.mypantryhub.com;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # All /api/* through Next.js: middleware injects Bearer JWT, then rewrites to FastAPI.
    # Do NOT proxy /api/ directly to the backend — that skips auth and causes 401s.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream pantry-pal-frontend:38472;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve CF client IP for app-level rate limiting (PP-071)
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream pantry-pal-frontend:38472;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    include /etc/nginx/snippets/require-cloudflare.conf;
    listen 443 ssl;
    http2 on;
    server_name *.mypantryhub.com;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://www.mypantryhub.com$request_uri;
}

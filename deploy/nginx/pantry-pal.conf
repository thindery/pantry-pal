# PantryPal / Pantry Hub — mypantryhub.com (PP-033)
# Install: copy to OVH nginx conf.d and reload (PP-034)

upstream pantry_pal_frontend {
    server 127.0.0.1:3000;
}

upstream pantry_pal_backend {
    server 127.0.0.1:8000;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name mypantryhub.com www.mypantryhub.com;
    return 301 https://www.mypantryhub.com$request_uri;
}

server {
    listen 80;
    server_name *.mypantryhub.com;
    return 301 https://www.mypantryhub.com$request_uri;
}

# Apex → www
server {
    listen 443 ssl;
    http2 on;
    server_name mypantryhub.com;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://www.mypantryhub.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.mypantryhub.com;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://pantry_pal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://pantry_pal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://pantry_pal_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Wildcard DNS fallback (Cloudflare * A record)
server {
    listen 443 ssl;
    http2 on;
    server_name *.mypantryhub.com;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://www.mypantryhub.com$request_uri;
}
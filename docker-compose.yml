version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: pantry-pal-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pantry_pal_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password_placeholder}
      - POSTGRES_DB=${POSTGRES_DB:-pantry_pal_prod}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pantry_pal_user} -d ${POSTGRES_DB:-pantry_pal_prod}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    container_name: pantry-pal-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - storage-data:/app/data
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pantry_pal_user}:${POSTGRES_PASSWORD:-secure_password_placeholder}@pantry-pal-db/${POSTGRES_DB:-pantry_pal_prod}
    env_file:
      - .env
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://pantry-pal-backend:8000
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - BUILD_ID=${BUILD_ID:-unknown}
    container_name: pantry-pal-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app-network

volumes:
  db-data:
  storage-data:

networks:
  app-network:
    external: true
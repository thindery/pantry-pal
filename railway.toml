[build]
builder = "nixpacks"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/health"

[[services]]
name = "frontend"
source = "frontend"
buildCommand = "npm run build"
startCommand = "npx serve dist -p 3000"

[[services]]
name = "backend"
source = "backend"
buildCommand = "npm run build"
startCommand = "npm run start"
